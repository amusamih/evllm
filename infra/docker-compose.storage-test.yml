name: evllm-storage-test

services:
  seaweed-org-a:
    image: chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${EVLLM_ORG_A_S3_ACCESS_KEY:?EVLLM_ORG_A_S3_ACCESS_KEY must be set}
      AWS_SECRET_ACCESS_KEY: ${EVLLM_ORG_A_S3_SECRET_KEY:?EVLLM_ORG_A_S3_SECRET_KEY must be set}
      S3_BUCKET: evllm
    ports:
      - "127.0.0.1:18333:8333"
    volumes:
      - seaweed-org-a-data:/data

  seaweed-org-b:
    image: chrislusf/seaweedfs:4.41@sha256:43b768cd62b00d132439cda881b93fd1adebf1b315e996e794087743821d771d
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${EVLLM_ORG_B_S3_ACCESS_KEY:?EVLLM_ORG_B_S3_ACCESS_KEY must be set}
      AWS_SECRET_ACCESS_KEY: ${EVLLM_ORG_B_S3_SECRET_KEY:?EVLLM_ORG_B_S3_SECRET_KEY must be set}
      S3_BUCKET: evllm
    ports:
      - "127.0.0.1:28333:8333"
    volumes:
      - seaweed-org-b-data:/data

volumes:
  seaweed-org-a-data:
  seaweed-org-b-data:
